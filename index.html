<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamilton Darling</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/d691212dbc.js" crossorigin="anonymous"></script>
</head>

<body>
  <section id="aboutme">
    <nav>
      <div id="personal__logo">Hamilton Darling</div>
      <ul id="nav__link--list">
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Languages</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li>
          <a href="" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contact</a>
        </li>
      </ul>
    </nav>
    <div class="flex flex-1">
      <div class="about-me__info row">
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/Ham.jpg" class="about-me__picture" alt="Picture of Me">
          </figure>
          <h1 class="about-me__info--title">
            Hello! I'm <span class="text--color">Hamilton Darling</span> 👋
          </h1>
          <p class="about-me__info--para">
             This is currently <strong class="text--color">filler text</strong> and subject to change. It continues to test the size of the text box for adjusting the web page.
          </p>
          <div class="about-me__links">
            <a href="" class="about-me__link">
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="" class="about-me__link"> 
              <i class="fa-brands fa-github"></i>             
            </a>
            <a href="" class="about-me__link">
              <i class="fa-regular fa-envelope"></i>             
            </a>
            <a href="" class="about-me__link">
              <i class="fa-regular fa-file"></i>
            </a>
          </div>
        </div>
        <figure class="about-me__img--container">
          <img src="./assets/undraw_websites.svg" class="about-me__img" alt="">
        </figure>
      </div>
    </div>
  </section>
  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">
          This is my <span class="text--color">technology stack</span>
        </h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/HTML5_Badge.svg" class="language__img" alt="">
            </figure>
            <span class="language__name">HTML</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/css-131-722685.png" class="language__img" alt="">
            </figure>
            <span class="language__name">CSS</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/javascript-1-225993.png" class="language__img" alt="">
            </figure>
            <span class="language__name">javascript</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/typescript-3521774-2945272.png" class="language__img" alt="">
            </figure>
            <span class="language__name">typescript</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/vue-282497.png" class="language__img" alt="">
            </figure>
            <span class="language__name">Vue</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/nuxt-dot-js-3628959-3030184.png" class="language__img" alt="">
            </figure>
            <span class="language__name">Nuxt</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://cdn.iconscout.com/icon/free/png-256/react-3-1175109.png" class="language__img" alt="">
            </figure>
            <span class="language__name">React</span>
          </div>
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="https://mobx.js.org/img/mobx.png" class="language__img" alt="">
            </figure>
            <span class="language__name">MobX</span>
          </div>
        </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
